AWSTemplateFormatVersion: '2010-09-09'
Description: >
  RetroArch Cloud Saves — EC2 infrastructure with S3, auto-recovery, and alerting.

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access

  AlertEmail:
    Type: String
    Default: ''
    Description: Email for alarm notifications (leave empty to skip)

  SshCidr:
    Type: String
    Default: '0.0.0.0/0'
    Description: CIDR block allowed to SSH (recommend your IP/32)

  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues:
      - t4g.small
      - t4g.micro
      - t4g.medium

  LatestAmiId:
    Type: String
    Description: >
      AMI ID for the instance (aarch64). Use a NixOS 26.05 arm64 AMI.
      Query the latest with:
        aws ec2 describe-images --owners 427812963091 --filters 'Name=name,Values=nixos/26.05*' 'Name=architecture,Values=arm64' --query 'sort_by(Images, &CreationDate)[-1].ImageId' --output text

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  # --- S3 ---
  SavesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'retroarch-saves-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # RetroArch saves — keep 30 days of old versions
          - Id: retroarch-version-expiry
            Status: Enabled
            Prefix: retroarch/
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          # Backups — keep 90 days of old versions
          - Id: backups-version-expiry
            Status: Enabled
            Prefix: backups/
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
          # Media — move to Infrequent Access after 30 days (cheaper)
          - Id: media-to-ia
            Status: Enabled
            Prefix: media/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          # Clean up failed multipart uploads
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # --- IAM ---
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt SavesBucket.Arn
                  - !Sub '${SavesBucket.Arn}/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # --- Networking ---
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RetroArch WebDAV server
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '0.0.0.0/0'
          Description: HTTPS WebDAV
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: '0.0.0.0/0'
          Description: HTTP for ACME certificate challenges
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
          Description: SSH access
      Tags:
        - Key: Name
          Value: retroarch-webdav

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: retroarch-webdav

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  # --- EC2 ---
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroups:
        - !Ref SecurityGroup
      Tags:
        - Key: Name
          Value: cloud-storage
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
            Encrypted: true

  # --- Alarms ---
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: retroarch-webdav-alarms

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Auto-recover on hardware failure
  RecoveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: retroarch-webdav-recovery
      AlarmDescription: Auto-recovers the instance on system status check failure
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Sub 'arn:aws:automate:${AWS::Region}:ec2:recover'
        - !If [HasAlertEmail, !Ref AlarmTopic, !Ref 'AWS::NoValue']

  # Alert if instance is down (status check covers both instance and system)
  InstanceDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: retroarch-webdav-down
      AlarmDescription: Instance failing status checks for 5+ minutes
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !If [HasAlertEmail, !Ref AlarmTopic, !Ref 'AWS::NoValue']

Outputs:
  ElasticIp:
    Description: Point your DNS A record here
    Value: !Ref ElasticIp

  BucketName:
    Description: S3 bucket name (used by setup.sh)
    Value: !Ref SavesBucket

  SshCommand:
    Description: SSH into the instance (NixOS uses 'root' on first boot with EC2 key pair)
    Value: !Sub 'ssh -i ${KeyPairName}.pem root@${ElasticIp}'

  SetupCommand:
    Description: After first SSH, copy configuration.nix and secrets.nix then run nixos-rebuild switch
    Value: 'See README for NixOS deployment steps'
